name: Preview

# Publishes each pull request as a Worker Preview at https://pr-<number>.brig.id
# and comments that URL on the pull request; the Preview is deleted when the
# pull request is closed. Production is not touched: see deploy.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish the Preview
    # Pull requests from forks get no Cloudflare credentials.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Build
        run: pnpm run build

      # The Cloudflare credentials are given to this step only, as in deploy.yml.
      - name: Publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler preview --name "$PREVIEW_NAME" --json > preview.out
          # Wrangler prints the asset upload progress on stdout before the JSON.
          sed -n '/^{/,$p' preview.out > preview.json
          url=$(jq -r '.preview.urls[0] // empty' preview.json)
          if [ -z "$url" ]; then
            echo "::error::wrangler preview returned no Preview URL."
            cat preview.out
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.publish.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview: $URL (commit ${SHA:0:7}). Not indexed; deleted when this pull request is closed."

  cleanup:
    name: Delete the Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
