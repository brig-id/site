name: Deploy

# Publishes brig.id (Worker `brigid-site`) when main changes. The build and the deploy
# run here rather than in Workers Builds, so the secrets stay in one place.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    # No `environment:` here. The secrets below are repository secrets, and a
    # secret of the same name in an environment would take precedence over
    # them.
    #
    # The Cloudflare credentials are given to the deploy step only: they never
    # reach dependency install or the build, which need no secret at all.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      # The worker is deployed with the pages it serves: test it first.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Name the missing secret instead of letting wrangler ask for a login.
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is missing or empty."
              exit 1
            fi
          done
          pnpm exec wrangler deploy
