<!doctype html>
<!-- Source of public/og.png (1200×630), the picture shown when a page of the
     site is shared. Regenerate it from the repository root with any Chromium:

       chromium --headless --hide-scrollbars --window-size=1200,630 \
         --screenshot=public/og.png scripts/og/og.html

     Run `pnpm install` first: the fonts are read from node_modules. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>brig·id</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2")
          format("woff2");
        font-style: italic;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: "Geist", sans-serif;
        color: #eef0f5;
        background:
          radial-gradient(
            900px 420px at 80% 110%,
            rgb(255 182 92 / 0.28),
            transparent 70%
          ),
          radial-gradient(
            700px 400px at 100% 0%,
            rgb(167 139 255 / 0.2),
            transparent 70%
          ),
          #05060a;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .brand svg {
        width: 52px;
        height: 52px;
      }
      .dot {
        display: inline-block;
        width: 0.17em;
        height: 0.17em;
        margin: 0 0.07em 0.2em;
        border-radius: 50%;
        background: #fff3df;
        box-shadow:
          0 0 0.35em rgb(255 243 223 / 0.85),
          -0.12em 0 0.5em #ffb65c,
          0.12em 0 0.5em #a78bff;
        vertical-align: middle;
      }
      h1 {
        font-size: 104px;
        font-weight: 560;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      em {
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        font-size: 1.08em;
        letter-spacing: -0.01em;
        background: linear-gradient(
          100deg,
          #ffb65c,
          #ff7d6b 28%,
          #ff86c8 52%,
          #a78bff 76%,
          #5ad7f0
        );
        -webkit-background-clip: text;
        color: transparent;
        padding-right: 0.08em;
      }
      p {
        font-size: 30px;
        color: #a6acba;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none">
        <path
          d="M10 16 25 7"
          stroke="#ffb65c"
          stroke-width="2.4"
          stroke-linecap="round"
        />
        <path
          d="M10 16h16.5"
          stroke="#ff86c8"
          stroke-width="2.4"
          stroke-linecap="round"
        />
        <path
          d="m10 16 15 9"
          stroke="#5ad7f0"
          stroke-width="2.4"
          stroke-linecap="round"
        />
        <circle cx="9" cy="16" r="4.6" fill="#05060a" />
        <circle cx="9" cy="16" r="3.4" fill="#fff3df" />
      </svg>
      <span>brig<span class="dot"></span>id</span>
    </div>
    <h1>One private self.<br />Many <em>identities.</em></h1>
    <p>An identity server you run yourself. Pre-beta, open source.</p>
  </body>
</html>
