allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  workerd: true
minimumReleaseAgeExclude:
  - "@web.awesome.me/webawesome-pro@3.11.0"
  - "@cloudflare/workerd-darwin-64@1.20260907.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260907.1"
  - "@cloudflare/workerd-linux-64@1.20260907.1"
  - "@cloudflare/workerd-linux-arm64@1.20260907.1"
  - "@cloudflare/workerd-windows-64@1.20260907.1"
  - miniflare@5.20260907.0-alpha
  - workerd@1.20260907.1
  - wrangler@4.129.1
overrides:
  # vite-imagetools (via qwik-city) and wrangler's miniflare both pin an
  # older sharp with known libvips/libheif CVEs (GHSA-f88m-g3jw-g9cj,
  # GHSA-rgj7-g3m4-5g8c, GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545); force the
  # patched line. Dev-only build tool (image asset processing, local
  # Workers simulator), never shipped to the browser.
  sharp: ">=0.35.4"
  # postcss (via vite/qwik) pins an old nanoid with an infinite-loop bug on
  # zero-size custom generators (GHSA-2v37-7h3g-55p8). Dev-only build tool.
  nanoid: ">=3.3.18"
